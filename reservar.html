<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Ferretería Los Maestros - Reservar Materiales</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/app.js"></script>

</head>
<body>

    <!-- CABECERA -->
    <header>
        <img src="assets/img/logo.png" alt="Logo de herramientas" class="logo-img">
        <h1>Ferretería Los Maestros</h1>
        <p>Atendido por sus propios dueños en La Serena - 22 años de trayectoria</p>
    </header>

    <!-- MENÚ DE NAVEGACION -->
  <div id="navbar-placeholder"></div>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        
        <!-- SECCIÓN DEL FORMULARIO -->
        <section class="formulario-seccion">
            <h2>Formulario de Reserva de Materiales</h2>
            <p class="subtitulo-seccion">Completa tus datos y los materiales que necesitas asegurar. Te guardaremos el pedido por un máximo de 2 horas.</p>

            <div class="formulario-contenedor">
                <form id="formReserva">
                    <!-- Campo Nombre -->
                    <div class="grupo-formulario">
                        <label for="nombre">Nombre Completo:</label>
                        <input type="text" id="nombre" placeholder="Ej: Juan Pérez" required>
                    </div>

                    <div class="grupo-formulario">
                        <label for="rut">RUT:</label>
                        <input type="text" id="rut" placeholder="Ej: 12.345.678-9" required>
                    </div>

                    <div class="grupo-formulario">
                        <label for="telefono">Teléfono de Contacto:</label>
                        <input type="tel" id="telefono" placeholder="Ej: +56 9 1234 5678" required>
                    </div>

                    <div class="grupo-formulario">
                        <label for="producto">Seleccione el Material:</label>
                        <select id="producto" required>
                            <option value="">-- Seleccione un producto --</option>
                            <option value="cemento">Cemento Polpaico 25kg ($5.490)</option>
                            <option value="taladro">Taladro Percutor Bosch ($69.990)</option>
                            <option value="pala">Pala Punta de Huevo ($12.990)</option>
                        </select>
                    </div>

                    <div class="grupo-formulario">
                        <label for="cantidad">Cantidad:</label>
                        <input type="number" id="cantidad" min="1" placeholder="Ej: 5" required>
                    </div>

                    <!-- Botón de Envío -->
                    <button type="submit" class="boton-enviar">Confirmar Reserva</button>
                </form>
            </div>
        </section>

    </main>

        <!-- Placeholder para inyectar el footer desde funciones.js -->
    <div id="footer-placeholder"></div>

    <!-- script formulario -->

    <script src="assets/js/funciones.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
